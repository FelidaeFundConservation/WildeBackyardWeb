name: Run Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
  
env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1
  ENVIRONMENT: staging
  PYTHON_VERSION: '3.12'
  
jobs:
  test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    env:
      # Django settings
      DJANGO_SECRET_KEY: test-secret-key-for-ci
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_ADMIN_URL: admin/
      # Backend API URL for staging
      BACKEND_API_URL: https://wildebackyard-api-dot-wildepod-339517.wl.r.appspot.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install uv
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        echo "$HOME/.cargo/bin" >> $GITHUB_PATH
    
    - name: Install dependencies
      run: |
        uv sync
        uv pip install -r requirements-dev.txt
    
    - name: Run tests
      run: |
        uv run pytest --verbose --tb=short

  # Job 2: Build and validate
  build:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate GCP credentials
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "Error: GCP_SA_KEY secret is not set or is empty"
            echo "Please configure the GCP_SA_KEY secret in your repository settings:"
            echo "1. Go to Settings → Secrets and variables → Actions"
            echo "2. Add a new secret named 'GCP_SA_KEY'"
            echo "3. Paste the contents of your service account JSON key"
            echo ""
            echo "To create a service account key, follow the guide in gcp_deployment/DEPLOYMENT_GUIDE.md"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate app.yaml
        run: |
          if [ ! -f "app.yaml" ]; then
            echo "Error: app.yaml not found"
            exit 1
          fi

          # Basic YAML validation
          python -c "import yaml; yaml.safe_load(open('app.yaml'))"
          echo "✓ app.yaml is valid"
